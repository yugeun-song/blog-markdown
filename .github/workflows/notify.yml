name: Update blog submodule

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: update-blog-submodule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yugeun-song/blog
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          submodules: true

      - run: |
          git submodule update --remote content
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update content submodule"
          # An engine push in between makes this one non-fast-forward; rebase onto it and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
